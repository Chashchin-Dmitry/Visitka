<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-orange: #ff8502;
            --primary-blue: #114efe;
            --text-dark: #000000;
            --text-gray: #5e5e5e;
            --bg-light: #f4f4f4;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-orange) 100%);
            padding: 40px 30px 30px;
            text-align: center;
            position: relative;
        }

        .logo {
            position: absolute;
            top: 15px;
            left: 20px;
            height: 40px;
        }

        .profile-image {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid var(--white);
            object-fit: cover;
            margin: 0 auto 15px;
            display: block;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .name {
            color: var(--white);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .title {
            color: rgba(255, 255, 255, 0.95);
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .tagline {
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            font-weight: 400;
            font-style: italic;
        }

        .card-body {
            padding: 35px 30px;
        }

        .contact-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .contact-links {
            display: grid;
            gap: 12px;
        }

        .contact-link {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: var(--bg-light);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .contact-link:hover {
            background: var(--white);
            border-color: var(--primary-orange);
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(255, 133, 2, 0.15);
        }

        .contact-link svg {
            width: 22px;
            height: 22px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .primary-link {
            background: linear-gradient(135deg, var(--primary-orange) 0%, #ff6b02 100%);
            color: var(--white);
            font-weight: 600;
            justify-content: center;
        }

        .primary-link:hover {
            background: linear-gradient(135deg, #ff6b02 0%, var(--primary-orange) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 133, 2, 0.3);
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: var(--text-gray);
            font-size: 13px;
            background: var(--bg-light);
        }

        @media (max-width: 480px) {
            .name {
                font-size: 24px;
            }

            .title {
                font-size: 16px;
            }

            .card-body {
                padding: 25px 20px;
            }

            .social-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
